<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV — Paul Signe</title>
<script>
// Même thème que le portfolio : choix mémorisé, sinon clair de 7 h à 20 h et sombre la nuit
(function () {
  var t; try { t = localStorage.getItem('theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') { var h = new Date().getHours(); t = h >= 7 && h < 20 ? 'light' : 'dark'; }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<nav class="nav" aria-label="Navigation">
  <a class="brand notranslate" href="index.html">Paul Signe</a>
  <ul><li><a href="index.html#annexes">← Retour au portfolio</a></li></ul>
  <div class="tools">
    <div class="lang notranslate" title="Traduire la page / Translate this page"><span aria-hidden="true">🌐</span><div id="gt"></div></div>
    <button class="icon-btn" type="button" id="themeBtn" aria-label="Changer de thème"></button>
  </div>
</nav>
<script src="assets/translate.js"></script>
<main>
<section>
  <div class="wrap">
    <div id="cv">
    <div class="head">
      <span class="label" style="color:var(--accent)">Annexe D</span><h2 class="disp">Mon CV</h2>
      <div class="btns"><a class="btn solid" href="assets/CV-Paul-Signe.pdf" download>Télécharger le CV (PDF)</a><a class="btn" href="assets/CV-Paul-Signe.pdf" target="_blank" rel="noopener">Ouvrir en plein écran ↗</a></div>
    </div>

    <!-- Le PDF est dessiné tel quel par PDF.js : le réexporter depuis cv/CV-Paul-Signe.docx suffit à mettre la page à jour -->
    <a class="cv-pdf" href="assets/CV-Paul-Signe.pdf" target="_blank" rel="noopener" aria-label="CV de Paul Signe (ouvrir le PDF)">
      <canvas id="cvCanvas"></canvas>
      <span class="cv-fallback" id="cvFallback" hidden>Aperçu indisponible.<br><span class="btn solid">Ouvrir le CV ↗</span></span>
    </a>
    </div>
  </div>
</section>
</main>
<script>
(function () {
  var btn = document.getElementById('themeBtn');
  function paint() { var d = document.documentElement.getAttribute('data-theme') === 'dark'; btn.textContent = d ? '☀' : '☾'; btn.setAttribute('aria-label', d ? 'Passer en thème clair' : 'Passer en thème sombre'); }
  btn.addEventListener('click', function () {
    var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('theme', t); } catch (e) {}
    paint();
  });
  paint();
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
// Aperçu du CV : la page 1 du PDF dessinée à la largeur du cadre (net sur écran haute densité)
(function () {
  var canvas = document.getElementById('cvCanvas'), fallback = document.getElementById('cvFallback');
  function fail() { canvas.remove(); fallback.hidden = false; }
  if (!window.pdfjsLib) return fail();
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  pdfjsLib.getDocument('assets/CV-Paul-Signe.pdf').promise
    .then(function (pdf) { return pdf.getPage(1); })
    .then(function (page) {
      var base = page.getViewport({ scale: 1 });
      var vp = page.getViewport({ scale: canvas.parentElement.clientWidth / base.width * Math.max(2, devicePixelRatio || 1) });
      canvas.width = vp.width; canvas.height = vp.height;
      return page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
    })
    .catch(fail);
})();
</script>
</body>
</html>
